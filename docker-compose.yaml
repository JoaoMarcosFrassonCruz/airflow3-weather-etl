# Ambiente local de desenvolvimento: Airflow 3 + PostgreSQL
# Credenciais abaixo são apenas para uso local (não use em produção).
x-airflow-env: &airflow-env
  PYTHONPATH: /opt/airflow
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: "False"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
  AIRFLOW__API_AUTH__JWT_SECRET: local-dev-jwt-secret-change-me
  AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Sao_Paulo
  AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
  # Conexão com o Data Warehouse (definida via variável de ambiente)
  AIRFLOW_CONN_WAREHOUSE_DB: postgresql://airflow:airflow@postgres:5432/warehouse

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow:
    image: apache/airflow:3.1.0
    command: standalone
    environment: *airflow-env
    ports:
      - "8081:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./include:/opt/airflow/include
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
